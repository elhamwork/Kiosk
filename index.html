<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>CVS OTC Kiosk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">cvs<span class="brand-heart">♥</span></span>
      <span class="brand-sub">pharmacy kiosk</span>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title">OTC CVS</h1>

    <form class="lookup-form" id="lookup-form">
      <label class="field">
        <span class="field-label">Symptom</span>
        <input id="symptom" type="text" placeholder="What's going on? e.g. headache, allergies..." autocomplete="off" />
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-label">Age</span>
          <select id="age">
            <option value="1">Under 2</option>
            <option value="4">2 – 5</option>
            <option value="9">6 – 11</option>
            <option value="15">12 – 17</option>
            <option value="30" selected>18 – 64</option>
            <option value="70">65+</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Gender</span>
          <select id="gender">
            <option value="prefer-not">Prefer not to say</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
          </select>
        </label>
      </div>

      <label class="field" id="pregnancy-field">
        <span class="field-label">Pregnant or nursing?</span>
        <select id="pregnancy">
          <option value="no">No</option>
          <option value="yes">Yes</option>
          <option value="na">N/A</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">Allergy</span>
        <select id="allergy">
          <option value="none">None</option>
          <option value="nsaid">NSAIDs (aspirin/ibuprofen)</option>
          <option value="antihistamine">Antihistamines</option>
          <option value="salicylate">Salicylates (aspirin/Pepto-Bismol)</option>
          <option value="other">Other</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">How many days?</span>
        <select id="duration">
          <option value="today">Just started today</option>
          <option value="few-days">1 – 2 days</option>
          <option value="week">3 – 6 days</option>
          <option value="weeks">1 – 2 weeks</option>
          <option value="long">More than 2 weeks</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">Other medications (optional)</span>
        <input id="medications" type="text" placeholder="e.g. none" autocomplete="off" />
      </label>

      <button type="submit" class="go-button">Go</button>
    </form>

    <section class="results" id="results" hidden>
      <h2 class="results-title">Recommended</h2>
      <ol class="results-list" id="results-list"></ol>
      <p class="disclaimer" id="results-disclaimer"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="inventory.js"></script>
  <script src="groq.js"></script>
  <script src="app.js"></script>
</body>
</html>
