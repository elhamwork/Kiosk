<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groq connection test</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .ok { color: #1a7f37; font-weight: 700; }
  .fail { color: #cc0000; font-weight: 700; }
</style>
</head>
<body>
  <h1>Groq connection test</h1>
  <p>Checks that <code>config.js</code> has a working key and this browser/network can reach <code>api.groq.com</code>. Not part of the kiosk itself — safe to delete once you've confirmed it works.</p>
  <button id="run">Run test</button>
  <pre id="output">Click "Run test" to check.</pre>

  <script src="config.js"></script>
  <script src="groq.js"></script>
  <script>
    const out = document.getElementById("output");
    document.getElementById("run").addEventListener("click", async () => {
      out.textContent = "Testing...";
      const configOk = typeof GROQ_API_KEY === "string" && GROQ_API_KEY && !GROQ_API_KEY.includes("YOUR_GROQ_API_KEY");
      if (!configOk) {
        out.innerHTML = '<span class="fail">FAILED</span>\n\nconfig.js is missing or still has the placeholder key.\nCopy config.example.js to config.js and paste in your real key from console.groq.com.';
        return;
      }
      const started = performance.now();
      try {
        const reply = await groqChat(
          [{ role: "user", content: "Reply with exactly the word: pong" }],
          { maxTokens: 10, timeoutMs: 8000 }
        );
        const ms = Math.round(performance.now() - started);
        out.innerHTML = `<span class="ok">SUCCESS</span> (${ms}ms)\n\nModel: ${typeof GROQ_MODEL === "string" ? GROQ_MODEL : "llama-3.3-70b-versatile"}\nResponse: ${JSON.stringify(reply)}\n\nThe kiosk's Groq integration is working.`;
      } catch (err) {
        out.innerHTML = `<span class="fail">FAILED</span>\n\n${err.message}\n\nCommon causes:\n- Invalid or revoked API key (check console.groq.com)\n- Network/firewall blocking api.groq.com\n- Ad blocker or browser extension blocking the request`;
      }
    });
  </script>
</body>
</html>
